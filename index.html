<style>
/* ── Layout: sidebar nav + main content, stacks to single col on mobile ── */
:root {
  /* Surfaces */
  --bg:        #0f1117;
  --bg-card:   #181c27;
  --bg-row:    #1e2235;
  --border:    #2a2f45;

  /* Ink */
  --fg:        #e8eaf0;
  --fg-2:      #8b91a8;
  --fg-3:      #555c78;

  /* Brand accent — electric violet */
  --accent:    #7c5cfc;
  --accent-2:  #5b3fde;
  --accent-glow: rgba(124,92,252,0.18);

  /* Status */
  --green:     #34d399;
  --amber:     #fbbf24;
  --red:       #f87171;
  --blue:      #60a5fa;

  /* Categorical palette (validated order) */
  --c1: #7c5cfc;
  --c2: #34d399;
  --c3: #fbbf24;
  --c4: #f87171;

  --radius: 10px;
  --font-body: 'Inter', system-ui, sans-serif;
  --font-mono: 'DM Mono', monospace;

  color-scheme: dark;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg:        #f4f5fb;
    --bg-card:   #ffffff;
    --bg-row:    #f0f1f9;
    --border:    #dde0ef;
    --fg:        #13162b;
    --fg-2:      #4a5070;
    --fg-3:      #9399b5;
    --accent-glow: rgba(124,92,252,0.10);
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg:        #f4f5fb;

  --bg-row:    #f0f1f9;

  --fg-2:      #4a5070;

}

*, *::before, *::after { box-sizing: border-box; margin: 0; }

body {
  background: var(--bg);

/* ── Header ── */

.sync-btn {

}

/* ── Nav tabs ── */
.tabs {

/* ── Pagination ── */

/* ── Tabs content ── */

/* ── Responsive ── */

  .kpi-grid { grid-template-columns: repeat(2, 1fr); }
  .bar-label { width: 90px; font-size: 10px; }
}
</style>

<script>
// ── IDs del Sheet ──
// Sheet ID extraído de la URL publicada
const SHEET_ID  = '2PACX-1vRhhHfr0ByI175iEeIFsswJZJxzrRooEvdElgj8cMIutRSdr2pZOHR_vIHYjoXtRyhys0JwgSt_ZviK';
const GID_RESUMEN  = '1303010142';
const GID_ANUNCIOS = '750518865';

const URL_RESUMEN  = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=${GID_RESUMEN}&single=true&output=csv`;
const URL_ANUNCIOS = `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/pub?gid=${GID_ANUNCIOS}&single=true&output=csv`;

// ── State ──
let resumenData = [];
let adsData = [];
let filteredAds = [];
let sortKey = 'gasto';
let sortDir = -1;
let page = 1;
const PAGE_SIZE = 20;

// ── CSV parser ──
function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g,''));
  return lines.slice(1).map(line => {
    const cols = [];
    let cur = '', inQ = false;
    for (let i = 0; i < line.length; i++) {
      const ch = line[i];
      if (ch === '"') { inQ = !inQ; }
      else if (ch === ',' && !inQ) { cols.push(cur); cur = ''; }
      else cur += ch;
    }
    cols.push(cur);
    const obj = {};
    headers.forEach((h,i) => obj[h] = (cols[i]||'').trim().replace(/^"|"$/g,''));
    return obj;
  });
}

function n(v) { const x = parseFloat((v||'').replace(',','.')); return isNaN(x) ? 0 : x; }
function fmt(v, d=0) {
  if (v >= 1e6) return (v/1e6).toFixed(1)+'M';
  if (v >= 1e3) return (v/1e3).toFixed(1)+'k';
  return v.toFixed(d);
}
function fmtMoney(v, mon) {
  return (mon==='USD'?'U$D ':'$') + fmt(v,0);
}

// ── Fetch CSV via Google Visualization API (no necesita proxy CORS) ──
// Convierte la URL CSV pública en una query a la Visualization API que sí permite CORS
function csvUrlToVizQuery(csvUrl) {
  // Extraemos gid del CSV URL
  const gidMatch = csvUrl.match(/gid=(\d+)/);
  const gid = gidMatch ? gidMatch[1] : '0';
  return `https://docs.google.com/spreadsheets/d/e/${SHEET_ID}/gviz/tq?tqx=out:csv&gid=${gid}`;
}

async function fetchCSV(url) {
  const errors = [];

  // Método 1: Google Visualization API (permite CORS nativamente)
  try {
    const vizUrl = csvUrlToVizQuery(url);
    const r = await fetch(vizUrl, { signal: AbortSignal.timeout(12000) });
    if (r.ok) {
      const text = await r.text();
      if (text && text.includes(',')) return text;
    }
  } catch(e) { errors.push('viz: ' + e.message); }

  // Método 2: corsproxy.io
  try {
    const r = await fetch('https://corsproxy.io/?' + encodeURIComponent(url), { signal: AbortSignal.timeout(10000) });
    if (r.ok) {
      const text = await r.text();
      if (text && text.includes(',')) return text;
    }
  } catch(e) { errors.push('corsproxy: ' + e.message); }

  // Método 3: allorigins
  try {
    const r = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(url), { signal: AbortSignal.timeout(10000) });
    if (r.ok) {
      const text = await r.text();
      if (text && text.includes(',')) return text;
    }
  } catch(e) { errors.push('allorigins: ' + e.message); }

  throw new Error('Sin datos. ¿El Sheet está publicado como CSV público?\n' + errors.join(' | '));
}

async function loadAll() {
  document.getElementById('kpi-area').innerHTML = '<div class="state-msg" style="grid-column:1/-1"><div class="spinner"></div><br>Sincronizando…</div>';
  document.getElementById('client-cards').innerHTML = '<div class="state-msg" style="grid-column:1/-1"><div class="spinner"></div></div>';

  try {
    const [rText, aText] = await Promise.all([
      fetchCSV(URL_RESUMEN),
      fetchCSV(URL_ANUNCIOS)
    ]);

    resumenData = parseCSV(rText);
    adsData     = parseCSV(aText).map(row => ({
      adName:   row['Anuncio']       || row['ad_name']      || '',
      conjunto: row['Conjunto']      || row['adset_name']   || '',
      campana:  row['Campaña']       || row['campaign_name']|| '',
      cliente:  row['Cliente']       || '',
      moneda:   row['Moneda']        || 'ARS',
      desde:    row['Desde']         || '',
      hasta:    row['Hasta']         || '',
      gasto:    n(row['Gasto']       || row['spend']        || '0'),
      impres:   n(row['Impresiones'] || row['impressions']  || '0'),
      alcance:  n(row['Alcance']     || row['reach']        || '0'),
      clics:    n(row['Clics Enlace']|| row['clicks']       || '0'),
      cpm:      n(row['CPM']         || '0'),
      cpc:      n(row['CPC']         || '0'),
      leads:    n(row['Leads']       || '0'),
      mensajes: n(row['Mensajes']    || '0'),
      cpl:      n(row['Costo/Lead']  || '0'),
      ventas:   n(row['Ventas']      || '0'),
      thruplay: n(row['ThruPlays']   || '0'),
    }));

    buildKPIs();
    buildClientCards();
    buildFilters();
    applyFilters();
    buildCharts();

    const now = new Date();
    document.getElementById('last-update').textContent =
      'Actualizado ' + now.toLocaleTimeString('es-AR', {hour:'2-digit',minute:'2-digit'});

  } catch(e) {
    document.getElementById('kpi-area').innerHTML =
      '<div class="state-msg" style="grid-column:1/-1">⚠️ Error al cargar datos.<br><small>' + e.message + '</small></div>';
  }
}

// ── KPIs ──
function buildKPIs() {
  const gastoTotal = adsData.reduce((s,r)=>s+r.gasto, 0);
  const leadsTotal = adsData.reduce((s,r)=>s+r.leads, 0);
  const msgsTotal  = adsData.reduce((s,r)=>s+r.mensajes, 0);
  const clicsTotal = adsData.reduce((s,r)=>s+r.clics, 0);
  const impresTotal= adsData.reduce((s,r)=>s+r.impres, 0);
  const cplGen     = leadsTotal > 0 ? gastoTotal/leadsTotal : 0;
  const cpmGen     = impresTotal > 0 ? gastoTotal/impresTotal*1000 : 0;

  const tiles = [
    { label:'Gasto Total', val:'$'+fmt(gastoTotal,0), sub:'todas las cuentas', cls:'kpi-accent' },
    { label:'Leads', val:fmt(leadsTotal,0), sub: leadsTotal>0?'CPL $'+cplGen.toFixed(0):'sin datos', cls:'kpi-green' },
    { label:'Mensajes', val:fmt(msgsTotal,0), sub:'conversaciones iniciadas', cls:'kpi-amber' },
    { label:'Clics', val:fmt(clicsTotal,0), sub:'en enlace', cls:'kpi-blue' },
    { label:'Impresiones', val:fmt(impresTotal,0), sub:'totales', cls:'' },
    { label:'CPM Prom.', val:'$'+cpmGen.toFixed(0), sub:'costo por 1000 impres.', cls:'' },
    { label:'Anuncios', val:String(adsData.length), sub:'registros totales', cls:'' },
    { label:'Clientes', val:String(resumenData.length), sub:'cuentas activas', cls:'' },
  ];

  document.getElementById('kpi-area').innerHTML = tiles.map(t => `
    <div class="kpi ${t.cls}">
      <div class="kpi-label">${t.label}</div>
      <div class="kpi-value">${t.val}</div>
      <div class="kpi-sub">${t.sub}</div>
    </div>`).join('');
}

// ── Client cards ──
function buildClientCards() {
  if (!resumenData.length) {
    document.getElementById('client-cards').innerHTML = '<div class="state-msg">Sin datos de clientes</div>';
    return;
  }
  const cats = [['--c1','#7c5cfc'],['--c2','#34d399'],['--c3','#fbbf24'],['--c4','#f87171']];
  const html = resumenData.map((r,i) => {
    const col = cats[i % cats.length][1];
    const mon = r['Moneda']||'ARS';
    const gasto = n(r['Gasto Total']||r['gasto']||'0');
    const leads = n(r['Leads']||'0');
    const msgs  = n(r['Mensajes']||'0');
    const cpl   = n(r['Costo/Lead']||'0');
    const anun  = r['Anuncios Totales']||r['anuncios']||'–';
    const meses = r['Meses con Datos']||'–';
    const cliente = r['Cliente']||r['cliente']||'—';
    const resp    = r['Responsable']||r['responsable']||'';
    return `
    <div class="client-card" style="border-top:2px solid ${col}">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:2px;">
        <div class="client-name">${cliente}</div>
        <span class="badge badge-${mon.toLowerCase()}">${mon}</span>
      </div>
      <div class="client-resp">${resp} · ${anun} anuncios · ${meses} mes(es)</div>
      <div class="client-metrics">
        <div class="cm"><div class="cm-label">Gasto</div><div class="cm-val accent">${mon==='USD'?'U$D':'$'}${fmt(gasto,0)}</div></div>
        <div class="cm"><div class="cm-label">Leads</div><div class="cm-val green">${fmt(leads,0)}</div></div>
        <div class="cm"><div class="cm-label">Mensajes</div><div class="cm-val amber">${fmt(msgs,0)}</div></div>
        <div class="cm"><div class="cm-label">CPL</div><div class="cm-val">${cpl>0?'$'+cpl.toFixed(0):'–'}</div></div>
      </div>
    </div>`;
  }).join('');
  document.getElementById('client-cards').innerHTML = html;
}

// ── Filters ──
function buildFilters() {
  const clientes = [...new Set(adsData.map(r=>r.cliente))].sort();
  const meses    = [...new Set(adsData.map(r=>r.desde.substring(0,7)))].filter(Boolean).sort().reverse();
  const campanas = [...new Set(adsData.map(r=>r.campana))].filter(Boolean).sort();

  const fc = document.getElementById('f-cliente');
  fc.innerHTML = '<option value="">Todos los clientes</option>' +
    clientes.map(c=>`<option>${c}</option>`).join('');

  const fm = document.getElementById('f-mes');
  fm.innerHTML = '<option value="">Todos los meses</option>' +
    meses.map(m=>`<option>${m}</option>`).join('');

  const fp = document.getElementById('f-campana');
  fp.innerHTML = '<option value="">Todas las campañas</option>' +
    campanas.map(c=>`<option>${c}</option>`).join('');
}

function applyFilters() {
  const fc = document.getElementById('f-cliente').value;
  const fm = document.getElementById('f-mes').value;
  const fp = document.getElementById('f-campana').value;
  const fs = document.getElementById('f-search').value.toLowerCase();

  filteredAds = adsData.filter(r => {
    if (fc && r.cliente !== fc) return false;
    if (fm && !r.desde.startsWith(fm)) return false;
    if (fp && r.campana !== fp) return false;
    if (fs && !r.adName.toLowerCase().includes(fs) && !r.campana.toLowerCase().includes(fs)) return false;
    return true;
  });

  sortTable(sortKey, false);
  page = 1;
  renderTable();
}

// ── Sort ──
function sortTable(key, toggle=true) {
  if (toggle) {
    if (sortKey === key) sortDir *= -1;
    else { sortKey = key; sortDir = -1; }
  }
  document.querySelectorAll('.sort-icon').forEach(el => {
    el.className = 'sort-icon';
    el.textContent = '';
  });
  const el = document.getElementById('s-'+key);
  if (el) { el.className = 'sort-icon active'; el.textContent = sortDir>0?'▲':'▼'; }

  filteredAds.sort((a,b) => {
    const av = a[key], bv = b[key];
    if (typeof av === 'number') return (av - bv) * sortDir;
    return String(av).localeCompare(String(bv)) * sortDir;
  });
  renderTable();
}

// ── Table render ──
function renderTable() {
  const total = filteredAds.length;
  const start = (page-1)*PAGE_SIZE;
  const rows  = filteredAds.slice(start, start+PAGE_SIZE);

  const tbody = document.getElementById('ads-tbody');
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="12" class="state-msg">Sin resultados</td></tr>';
    document.getElementById('page-info').textContent = '0 registros';
    document.getElementById('btn-prev').disabled = true;
    document.getElementById('btn-next').disabled = true;
    return;
  }

  tbody.innerHTML = rows.map(r => `
    <tr>
      <td class="td-name" title="${r.adName}">${r.adName||'—'}</td>
      <td class="td-muted">${r.cliente}</td>
      <td class="td-muted">${r.desde.substring(0,7)||'—'}</td>
      <td class="td-num td-accent">${r.moneda==='USD'?'U$D':'$'}${fmt(r.gasto,0)}</td>
      <td class="td-num td-muted">${fmt(r.impres,0)}</td>
      <td class="td-num td-muted">${fmt(r.alcance,0)}</td>
      <td class="td-num">${fmt(r.clics,0)}</td>
      <td class="td-num td-muted">${r.cpm>0?'$'+r.cpm.toFixed(0):'–'}</td>
      <td class="td-num td-muted">${r.cpc>0?'$'+r.cpc.toFixed(0):'–'}</td>
      <td class="td-num td-green">${r.leads>0?r.leads:'–'}</td>
      <td class="td-num">${r.mensajes>0?r.mensajes:'–'}</td>
      <td class="td-num">${r.cpl>0?'$'+r.cpl.toFixed(0):'–'}</td>
    </tr>`).join('');

  document.getElementById('page-info').textContent =
    `${start+1}–${Math.min(start+PAGE_SIZE,total)} de ${total}`;
  document.getElementById('btn-prev').disabled = page === 1;
  document.getElementById('btn-next').disabled = start+PAGE_SIZE >= total;
}

function changePage(d) { page += d; renderTable(); }

// ── Charts ──
function buildCharts() {
  const byCliente = {};
  adsData.forEach(r => {
    if (!byCliente[r.cliente]) byCliente[r.cliente] = {gasto:0,leads:0,mensajes:0,moneda:r.moneda};
    byCliente[r.cliente].gasto    += r.gasto;
    byCliente[r.cliente].leads    += r.leads;
    byCliente[r.cliente].mensajes += r.mensajes;
  });
  const clientes = Object.keys(byCliente);
  const colors   = ['#7c5cfc','#34d399','#fbbf24','#f87171'];

  // Bar chart gasto
  buildBarChart('chart-gasto', clientes, clientes.map(c=>byCliente[c].gasto), colors, c=>'$'+fmt(byCliente[c].gasto,0));

  // Bar chart leads
  buildBarChart('chart-leads', clientes, clientes.map(c=>byCliente[c].leads), colors, c=>fmt(byCliente[c].leads,0)+' leads');

  // Bar chart mensajes
  buildBarChart('chart-mensajes', clientes, clientes.map(c=>byCliente[c].mensajes), colors, c=>fmt(byCliente[c].mensajes,0)+' msjs');

  // Donut
  const totalG = clientes.reduce((s,c)=>s+byCliente[c].gasto, 0);
  buildDonut(clientes, clientes.map(c=>byCliente[c].gasto), colors, totalG);
}

function buildBarChart(id, labels, values, colors, labelFn) {
  const max = Math.max(...values, 1);
  const el  = document.getElementById(id);
  el.innerHTML = labels.map((l,i) => `
    <div class="bar-row">
      <div class="bar-label" title="${l}">${l}</div>
      <div class="bar-track">
        <div class="bar-fill" style="width:${(values[i]/max*100).toFixed(1)}%;background:${colors[i%colors.length]}"></div>
      </div>
      <div class="bar-val">${labelFn(l)}</div>
    </div>`).join('');
}

function buildDonut(labels, values, colors, total) {
  const cx=60, cy=60, r=48, stroke=14;
  const circ = 2*Math.PI*r;
  let offset = 0;
  const paths = values.map((v,i) => {
    const pct = total>0 ? v/total : 0;
    const dash = circ*pct;
    const p = `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none"
      stroke="${colors[i%colors.length]}" stroke-width="${stroke}"
      stroke-dasharray="${dash.toFixed(2)} ${(circ-dash).toFixed(2)}"
      stroke-dashoffset="${(-offset).toFixed(2)}"
      transform="rotate(-90 ${cx} ${cy})"/>`;
    offset += circ*pct;
    return p;
  });

  document.getElementById('donut-svg').innerHTML =
    `<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="var(--bg-row)" stroke-width="${stroke}"/>` +
    paths.join('') +
    `<text x="${cx}" y="${cy-6}" text-anchor="middle" font-size="11" fill="var(--fg-3)" font-family="Inter,sans-serif">Total</text>
     <text x="${cx}" y="${cy+10}" text-anchor="middle" font-size="13" font-weight="700" fill="var(--fg)" font-family="Inter,sans-serif">$${fmt(total,0)}</text>`;

  document.getElementById('donut-legend').innerHTML = labels.map((l,i) => `
    <div class="legend-item">
      <div class="legend-dot" style="background:${colors[i%colors.length]}"></div>
      <span class="legend-label">${l}</span>
      <span class="legend-val">$${fmt(values[i],0)}</span>
    </div>`).join('');
}

// ── Tabs ──
function showTab(id, btn) {
  document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(el => el.classList.remove('active'));
  document.getElementById('tab-'+id).classList.add('active');
  btn.classList.add('active');
}

// ── Theme ──
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  const next = cur === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next);
  document.querySelector('.theme-toggle').textContent = next === 'dark' ? '☀' : '☾';
  try { localStorage.setItem('mili-theme', next); } catch(e){}
}

// ── Init ──
try {
  const saved = localStorage.getItem('mili-theme');
  if (saved) { document.documentElement.setAttribute('data-theme', saved); }
} catch(e) {}

loadAll();
</script>
